<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0b1329;
      color: #ffffff;
      margin: 0;
      padding: 16px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      padding-bottom: 10px;
      margin-bottom: 12px;
    }
    .logo {
      font-weight: 700;
      font-size: 14px;
      color: #60a5fa;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .status-badge {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 99px;
      background: rgba(16,185,129,0.15);
      color: #34d399;
      border: 1px solid rgba(16,185,129,0.3);
    }
    .card {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 10px;
      font-size: 12px;
    }
    .btn {
      width: 100%;
      background: #2563eb;
      color: white;
      border: none;
      padding: 8px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 6px;
      transition: background 0.2s;
    }
    .btn:hover { background: #1d4ed8; }
    .btn-secondary {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      color: #94a3b8;
    }
    .btn-secondary:hover { background: rgba(255,255,255,0.1); color: #fff; }
    .footer {
      font-size: 10px;
      color: #64748b;
      text-align: center;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">⚡ JobPilot AI</div>
    <div class="status-badge" id="status-text">Connected</div>
  </div>

  <div class="card">
    <div style="font-weight:600; margin-bottom:4px;">LinkedIn &amp; Naukri Auto-Pilot</div>
    <div style="color:#94a3b8; font-size:11px; margin-bottom:8px;">
      Automatically populates Easy Apply screening forms with your verified profile data.
    </div>
    <label style="display:flex; align-items:center; gap:8px; font-size:11px; cursor:pointer;">
      <input type="checkbox" id="auto-fill-toggle" checked>
      <span>Enable Easy Apply Auto-Fill</span>
    </label>
  </div>

  <button class="btn" id="scrape-page-btn">📥 Scrape Jobs on Current Page</button>
  <button class="btn btn-secondary" id="open-dashboard-btn">Open Web Dashboard</button>

  <div class="footer">JobPilot AI · Zero-Ban Safe Mode Active</div>

  <script src="popup.js"></script>
</body>
</html>
